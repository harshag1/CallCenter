services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voice_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - voice-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voice-agent-postgres:
