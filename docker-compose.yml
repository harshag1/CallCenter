services:
  db:
    # Multi-architecture OCI index for pgvector/pgvector:pg16, resolved 2026-07-28.
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: voice_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - voice-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voice-agent-postgres:
