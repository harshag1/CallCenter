name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.19.0"
          - "22.13.0"
          - "24.x"
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Run the web test suite
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Build without provider credentials or external egress
        working-directory: web
        env:
          NEXT_PUBLIC_APP_NAME: Harsha's Amazing Call Center
          PUBLIC_ORIGIN: http://127.0.0.1:3000
          HACC_ENABLE_EXTERNAL_EGRESS: "false"
        run: npm run build

  bridge:
    name: Realtime bridge (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20.19.0"
          - "22.13.0"
          - "24.x"
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install locked bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: bridge
        run: npm run check

      - name: Run bridge tests
        working-directory: bridge
        run: npm test

      - name: Build the pinned bridge container
        if: matrix.node == '22.13.0'
        run: docker build --tag hacc-bridge:ci bridge

  public-release-audit:
    name: Public-release secret gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked scanner dependencies
        working-directory: web
        run: npm ci

      - name: Audit locked web dependencies
        working-directory: web
        run: npm run audit:dependencies:locked

      - name: Audit locked bridge dependencies
        working-directory: bridge
        run: |
          npm audit --package-lock-only --audit-level=high
          npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Verify repository object integrity
        run: git fsck --full --strict

      - name: Scan the exact publishable working tree
        working-directory: web
        run: npm run audit:public:worktree

      - name: Scan every reachable public-history object
        working-directory: web
        run: npm run audit:public:history

  database-security:
    name: PostgreSQL, pgvector, RLS, migration, and replay gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Linux/amd64 pgvector PostgreSQL 16 image resolved from the pg16 tag.
        image: pgvector/pgvector@sha256:eb2a451bbc37d71947fafac0bb76d2992c6aafb305942a708e0d6c567eb42985
        env:
          POSTGRES_DB: voice_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          # Avoid colliding with PostgreSQL preinstalled on the hosted runner.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voice_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Install pgvector for the runner's PostgreSQL 16 isolation cluster
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16-pgvector
          test "$(pg_config --version | cut -d' ' -f2 | cut -d. -f1)" = "16"
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Apply migrations to the pgvector service twice
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          DATABASE_SSL: disable
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs

      - name: Run the database-backed suites declared by the checked-in Gate 0 inventory
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          DATABASE_SSL: disable
          FLOW_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          SECURITY_MIGRATION_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          AUTH_SECURITY_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          CONVERSATION_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
          CREDENTIAL_VAULT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/voice_agents
        run: |
          ./node_modules/.bin/vitest run \
            lib/benchmark/__tests__/gate0-skip-inventory.test.ts \
            --maxWorkers=1
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const inventoryPath = "../benchmarks/voice-long-horizon/GATE0_SKIP_INVENTORY.json";
          const inventoryBytes = readFileSync(inventoryPath);
          const inventory = JSON.parse(inventoryBytes.toString("utf8"));
          const databaseReasons = new Set([
            "missing_postgresql_integration_environment",
            "missing_postgresql_admin_integration_environment",
          ]);
          const environmentQualifiedReason =
            "missing_local_asr_integration_environment";
          if (
            inventory.schema_version !== 1
            || inventory.artifact_type !== "gate0_test_skip_inventory"
            || !Array.isArray(inventory.entries)
            || !Number.isSafeInteger(inventory.total_skipped_suites_when_unconfigured)
            || !Number.isSafeInteger(inventory.total_skipped_tests_when_unconfigured)
            || !Number.isSafeInteger(inventory.public_ci_required_suites)
            || !Number.isSafeInteger(inventory.public_ci_required_tests)
            || !Number.isSafeInteger(inventory.environment_qualified_suites)
            || !Number.isSafeInteger(inventory.environment_qualified_tests)
            || inventory.entries.length !== inventory.total_skipped_suites_when_unconfigured
          ) {
            throw new Error("Gate 0 conditional-test inventory is malformed");
          }
          const seenPaths = new Set();
          let declaredTestTotal = 0;
          let publicCiSuites = 0;
          let publicCiTests = 0;
          let environmentQualifiedSuites = 0;
          let environmentQualifiedTests = 0;
          for (const entry of inventory.entries) {
            const databaseBacked = databaseReasons.has(entry?.reason_category);
            const environmentQualified =
              entry?.reason_category === environmentQualifiedReason;
            if (
              typeof entry?.path !== "string"
              || !entry.path.startsWith("web/")
              || seenPaths.has(entry.path)
              || !Number.isSafeInteger(entry.test_count)
              || entry.test_count <= 0
              || (!databaseBacked && !environmentQualified)
              || (databaseBacked && entry.gate0_disposition !== "must_run")
              || (
                environmentQualified
                && entry.gate0_disposition !== "environment_qualified_release_receipt"
              )
            ) {
              throw new Error("Gate 0 conditional-test inventory contains an invalid entry");
            }
            seenPaths.add(entry.path);
            declaredTestTotal += entry.test_count;
            if (databaseBacked) {
              publicCiSuites += 1;
              publicCiTests += entry.test_count;
            } else {
              environmentQualifiedSuites += 1;
              environmentQualifiedTests += entry.test_count;
            }
          }
          if (
            declaredTestTotal !== inventory.total_skipped_tests_when_unconfigured
            || publicCiSuites !== inventory.public_ci_required_suites
            || publicCiTests !== inventory.public_ci_required_tests
            || environmentQualifiedSuites !== inventory.environment_qualified_suites
            || environmentQualifiedTests !== inventory.environment_qualified_tests
          ) {
            throw new Error("Gate 0 conditional-test inventory total is inconsistent");
          }

          const selected = inventory.entries.filter((entry) =>
            databaseReasons.has(entry.reason_category)
          );
          if (selected.length === 0) {
            throw new Error("Gate 0 inventory declares no database-backed suites");
          }
          const selection = {
            inventory_sha256: createHash("sha256").update(inventoryBytes).digest("hex"),
            paths: selected.map((entry) => entry.path.slice("web/".length)),
            suite_count: selected.length,
            test_count: selected.reduce((total, entry) => total + entry.test_count, 0),
          };
          writeFileSync(".ci-gate0-database-selection.json", JSON.stringify(selection));
          writeFileSync(".ci-gate0-database-files.txt", `${selection.paths.join("\n")}\n`);
          NODE
          mapfile -t test_files < .ci-gate0-database-files.txt
          test "${#test_files[@]}" -gt 0
          ./node_modules/.bin/vitest run "${test_files[@]}" \
            --maxWorkers=1 \
            --reporter=json \
            --outputFile=.ci-database-results.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, rmSync } from "node:fs";
          import { relative, resolve, sep } from "node:path";

          const reportPath = ".ci-database-results.json";
          const report = JSON.parse(readFileSync(reportPath, "utf8"));
          const inventoryBytes = readFileSync(
            "../benchmarks/voice-long-horizon/GATE0_SKIP_INVENTORY.json"
          );
          const selection = JSON.parse(
            readFileSync(".ci-gate0-database-selection.json", "utf8")
          );
          const inventorySha256 = createHash("sha256")
            .update(inventoryBytes)
            .digest("hex");
          const executedPaths = report.testResults
            .map((result) => relative(process.cwd(), resolve(result.name)).split(sep).join("/"))
            .sort();
          const expectedPaths = [...selection.paths].sort();
          if (
            selection.inventory_sha256 !== inventorySha256
            || report.success !== true
            || report.numPassedTests !== selection.test_count
            || report.numTotalTests !== selection.test_count
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.testResults.length !== selection.suite_count
            || JSON.stringify(executedPaths) !== JSON.stringify(expectedPaths)
            || report.testResults.some((result) => result.status !== "passed")
          ) {
            throw new Error(
              "Gate 0 database-backed suites did not execute exactly as declared by the inventory"
            );
          }
          rmSync(reportPath);
          rmSync(".ci-gate0-database-selection.json");
          rmSync(".ci-gate0-database-files.txt");
          NODE

      - name: Run tenant isolation, RLS, migration reapplication, and all conditional database suites
        working-directory: web
        env:
          DATABASE_SSL: disable
        run: npm run db:test-isolation
