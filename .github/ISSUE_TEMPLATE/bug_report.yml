name: Bug report
description: Report reproducible framework behavior without private data or provider secrets.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, environment values, caller data, recordings, transcripts, phone numbers, database URLs, authorization headers, or raw provider payloads. Report vulnerabilities through SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact Git commit where the behavior occurs.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flow v2 or mission runtime
        - Realtime provider or transport
        - Tool, MCP, or action authority
        - Builder or web interface
        - Database or migration
        - Telephony bridge
        - Benchmark or evidence
        - Installation or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List deterministic steps and a minimal redacted flow/configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include stable error codes or sanitized logs only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser/provider/model when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private data, caller content, and provider payloads.
          required: true
        - label: I did not contact a real person or open a paid provider session solely to file this report.
          required: true
